<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (48px-multiple ICO/PNG required for Google search results) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180.png" />

    <!-- Primary -->
    <title>Karan Kumar | Software Engineer</title>
    <meta name="title" content="Karan Kumar | Software Engineer" />
    <meta
      name="description"
      content="Freelance MERN Stack & Gen AI developer. Full-stack web apps, AI-powered tools, and REST APIs — from idea to deployment. Google Student Ambassador for Gemini, 3 internships, 5+ shipped projects."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karanchoudhary.dev/" />
    <meta property="og:title" content="Karan Kumar | Software Engineer" />
    <meta
      property="og:description"
      content="Freelance MERN Stack & Gen AI developer. Full-stack web apps, AI-powered tools, and REST APIs — from idea to deployment. Google Student Ambassador for Gemini, 3 internships, 5+ shipped projects."
    />
    <meta property="og:image" content="https://karanchoudhary.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X (X's parser reads name=, not property=) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://karanchoudhary.dev/" />
    <meta name="twitter:title" content="Karan Kumar | Software Engineer" />
    <meta
      name="twitter:description"
      content="Freelance MERN Stack & Gen AI developer. Full-stack web apps, AI-powered tools, and REST APIs — from idea to deployment. Google Student Ambassador for Gemini, 3 internships, 5+ shipped projects."
    />
    <meta name="twitter:image" content="https://karanchoudhary.dev/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://karanchoudhary.dev/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
